name: Cron Trader

on:
  schedule:
    # Run every hour for H1 strategies
    # H4 strategies will only trigger at H4 closes (0, 4, 8, 12, 16, 20)
    - cron: '5 * * * *'  # Every hour at :05
  
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install pandas numpy requests numba pyyaml
    
    - name: Run engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python engine.py
    
    - name: Commit trade logs
      run: |
        git config --local user.email "bot@cron-trader.local"
        git config --local user.name "Cron Trader"
        git add logs/ README.md || true
        git diff --staged --quiet || git commit -m "📊 $(date -u +'%Y-%m-%d %H:%M') UTC"
        git push || true
