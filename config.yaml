# cron-trader configuration

telegram:
  enabled: true
  notification_level: smart  # smart | all | positions | daily | none
  include_positions_detail: true
  include_activity_summary: true
  show_progress_bars: true
  quiet_hours: []  # UTC hours to suppress notifications: [0,1,2,3,4,5]

# Risk per trade in USD (for P&L calculation)
default_risk_usd: 500

# Strategies to run
strategies:
  h4_breakout_ensemble:
    enabled: true
    risk_usd: 500
    
  weekly_breakout:
    enabled: true
    risk_usd: 500
  
  vol_squeeze_sol:
    enabled: true
    risk_usd: 500
  
  btc_leadlag_eth:
    enabled: true
    risk_usd: 500
    
  regime_rsi:
    enabled: true
    risk_usd: 500

